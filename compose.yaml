services:
  db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nicheforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nicheforge_local}
      POSTGRES_DB: nicheforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nicheforge -d nicheforge"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
